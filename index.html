<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ネットワーク観察ラボ</title>
<link rel="icon" href="data:,">
<style>
  /* http-exp/css/style.css と同じ配色（トップは単独で表示できるようインライン） */
  :root { --ink:#2b2b2b; --muted:#6b6560; --accent:#c4471b; --bg:#ffffff; --panel:#f4f1ec; --line:#ddd6cc; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family: "Hiragino Sans","Hiragino Kaku Gothic ProN","Meiryo","Yu Gothic",sans-serif; line-height:1.75; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin-top: 0; }
  .cards { display: grid; gap: 16px; margin-top: 28px; }
  .card { display: block; background: var(--panel); border-radius: 8px; padding: 18px 20px;
    text-decoration: none; color: var(--ink); border: 1px solid transparent; }
  .card:hover { border-color: var(--line); background: #efebe4; }
  .card h2 { margin: 0 0 4px; font-size: 1.15rem; color: var(--accent); }
  .card p { margin: 0; color: var(--muted); }
  footer { margin-top: 48px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>ネットワーク観察ラボ</h1>
  <p class="lead">授業「コンピュータネットワーク」の演習・説明用ページです。</p>

  <div class="cards">
    <a class="card" href="http-exp/">
      <h2>HTTP 観察実験</h2>
      <p>Chrome のデベロッパーツール（DevTools）で、Web のリクエストとレスポンスを観察する練習用ページ</p>
    </a>
    <a class="card" href="animations/">
      <h2>説明アニメーション</h2>
      <p>パケットの流れやルーティングなど、授業で使う動く図</p>
    </a>
  </div>

  <footer>コンピュータネットワーク 演習用ページ</footer>
</main>
</body>
</html>
