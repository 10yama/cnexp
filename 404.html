<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 ページが見つかりません</title>
<link rel="icon" href="data:,">
<style>
  body { font-family: sans-serif; max-width: 760px; margin: 0 auto; padding: 32px 20px; line-height: 1.75; color: #2b2b2b; }
  .code { font-size: 4rem; font-weight: bold; color: #c4471b; margin: 0; }
</style>
</head>
<body>
  <p class="code">404</p>
  <h1>Not Found：そのページはありません</h1>
  <p>リクエストされた URL に対応するファイルが、サーバに見つかりませんでした。</p>
  <p>DevTools の Network タブで、このページの Status Code を確かめてみよう。<br>
  画面には「ページ」が表示されているのに、ステータスコードは 200 ではありません。</p>
  <p><a id="home" href="/">← 目次にもどる</a></p>
<script>
  // GitHub Pages のプロジェクトサイト（https://ユーザ名.github.io/リポジトリ名/）でも目次に戻れるようにする
  var parts = location.pathname.split('/');
  if (location.hostname.endsWith('github.io') && parts.length > 2) {
    document.getElementById('home').href = '/' + parts[1] + '/';
  }
</script>
</body>
</html>
