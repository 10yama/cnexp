<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>部品でできたページ</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
<script src="js/script.js"></script>
</head>
<body>
<main>
  <h1>部品でできたページ</h1>
  <p class="lead">見た目は 1 ページでも、中身はいくつものファイルの組み合わせです。</p>

  <p><img src="img/server.png" width="480" height="320" alt="サーバのイラスト"></p>
  <p id="js-message">（JavaScript が動くと、ここの文章が書き換わります）</p>

  <div class="panel">
    <h3>Network タブで確かめよう</h3>
    <ul>
      <li>リクエストは何回？ それぞれ何のファイル？（Type 列を見る）</li>
      <li>いちばん大きいファイルはどれ？（Size 列を見る）</li>
      <li>ファイル名をクリックして「Headers（ヘッダー）」を開くと、Request URL・Request Method・Status Code が見える</li>
    </ul>
  </div>
  <p><a href="./">← 目次にもどる</a></p>
</main>
</body>
</html>
