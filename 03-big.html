<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大きな写真のページ</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <h1>大きな写真のページ</h1>
  <p class="lead">スマホで撮った写真くらいの大きさ（約 2.8MB）の画像を 1 枚だけ置いています。</p>

  <p><img src="img/big-photo.jpg" width="4000" height="3000" alt="山と夕焼けの風景（演習用に作った画像）"></p>

  <div class="panel">
    <h3>Network タブで確かめよう</h3>
    <ul>
      <li>写真（big-photo.jpg）のサイズは何バイト？（Size 列、またはクリックして Headers の <code>content-length</code>）</li>
      <li>読み込みにかかった時間は？（Time 列）</li>
      <li>「スロットリング」を「低速 4G」などにして再読み込みすると、どう変わる？</li>
    </ul>
  </div>
  <div class="panel">
    <h3>考えてみよう</h3>
    <p>この写真を、1 パケットあたり 1,480 バイトのデータに分けて送るとすると、パケットはいくつ必要？</p>
  </div>
  <p><a href="./">← 目次にもどる</a></p>
</main>
</body>
</html>
